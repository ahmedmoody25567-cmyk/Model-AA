<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Examination - Model A - Dr. Dina Adel</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="brand-title">Dr. Dina Adel</div>
        <div class="timer-box" id="timerBox" style="display: none;">
            <span>⏱️</span>
            <span id="timer">75:00</span>
        </div>
    </header>

    <div class="container">
        <!-- شاشة تسجيل البيانات -->
        <div class="card welcome-card" id="loginScreen">
            <h1>English Examination</h1>
            <p>Model A - Online Assessment</p>
            <form id="startForm">
                <div class="input-group">
                    <label for="studentName">اسم الطالب رباعي:</label>
                    <input type="text" id="studentName" required placeholder="أدخل اسمك بالكامل">
                </div>
                <div class="input-group">
                    <label for="parentPhone">رقم ولي الأمر:</label>
                    <input type="tel" id="parentPhone" required placeholder="01xxxxxxxxx" pattern="[0-9]{11}">
                </div>
                <button type="submit" class="btn-primary">بدء الامتحان الآن</button>
            </form>
        </div>

        <!-- شاشة الأسئلة -->
        <div id="examScreen" style="display: none;">
            <form id="examForm">
                <div id="questionsContainer"></div>
                <button type="submit" class="btn-primary" style="margin-top: 20px; margin-bottom: 50px;">إنهاء وتسليم الامتحان</button>
            </form>
        </div>

        <!-- شاشة شكر وتسليم الإجابات -->
        <div class="card lock-card" id="submittedScreen" style="display: none;">
            <h2>✅ تم تسليم إجاباتك بنجاح!</h2>
            <p>شكراً لك، تم حفظ الإجابات وسيتم إعلان النتيجة لاحقاً.</p>
        </div>
    </div>

    <footer>
        Designed by <strong>Ahmed Sherif</strong>
    </footer>

    <script src="script.js"></script>
</body>
</html>
